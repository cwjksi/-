<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 상세 학습 현황 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .study-card { transition: all 0.2s ease-in-out; }
        .study-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-10">
        
        <header class="text-center mb-12 bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">📚 실시간 교재별 학습 현황</h1>
            <p class="text-slate-500 text-lg">2027학년도 수능을 준비하기 위해 수능까지 사용할 교재를 정리했습니다.<br><br>
        <strong class="text-blue-600">아들이 어떻게 공부하고 있는지 실시간으로 알 수 있습니다.</strong>
    </p>
            <div id="last-update" class="text-xs text-slate-400 mt-4 font-mono"></div>
        </header>

        <div id="study-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-20 text-slate-400">
                데이터를 불러오는 중입니다...
            </div>
        </div>

        <footer class="mt-20 text-center text-slate-400 text-sm pb-10">
            <p>입력한 교재 정보가 실시간으로 반영됩니다.</p>
        </footer>
    </div>

    <script>
        // 🌟 중요: 구글 시트에서 복사한 .csv 주소를 여기에 다시 넣어주세요!
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSZBXfqKDnblDo8nQmvcnxBCBkDJ3OieS-FPAd_6DVDb2ff8kVCGvWIArYeL_D_ya8iSqDp86ccpvp8/pub?output=csv';

        async function fetchStudyData() {
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error('연결 실패');
                
                const data = await response.text();
                const rows = data.split('\n');
                
                const container = document.getElementById('study-container');
                container.innerHTML = '';

                const now = new Date();
                document.getElementById('last-update').innerText = `LAST UPDATED: ${now.toLocaleString()}`;

                // 데이터가 있는지 확인 (헤더 제외하고 2번째 줄부터)
                if (rows.length <= 1) {
                    container.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400">아직 입력된 학습 데이터가 없습니다.</div>';
                    return;
                }

                // 최신 데이터가 위로 오게 역순으로 표시
                for (let i = rows.length - 1; i >= 1; i--) {
                    const row = rows[i].trim();
                    if (!row) continue;

                    // 쉼표로 데이터 분리
                    const [bookName, difficulty, content, pages] = row.split(',');

                    const card = `
                        <div class="bg-white p-7 rounded-[2rem] border border-slate-100 shadow-sm study-card">
                            <div class="flex justify-between items-start mb-4">
                                <span class="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-full uppercase tracking-wider">
                                    난이도: ${difficulty || '-'}
                                </span>
                                <span class="text-slate-400 text-sm font-medium">${pages || 0} 페이지 완료</span>
                            </div>
                            
                            <h2 class="text-xl font-bold text-slate-800 mb-3">${bookName || '교재명 없음'}</h2>
                            
                            <div class="bg-slate-50 p-4 rounded-2xl">
                                <p class="text-slate-600 text-sm leading-relaxed">
                                    ${content || '상세 내용이 기록되지 않았습니다.'}
                                </p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('study-container').innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <p class="text-red-500 font-bold text-lg">데이터를 불러올 수 없습니다.</p>
                        <p class="text-slate-400 text-sm mt-2 font-light">1. 구글 시트 '웹에 게시(.csv)' 확인<br>2. 코드 내 sheetUrl 주소 확인<br>3. 시트 공유 설정 확인</p>
                    </div>
                `;
            }
        }

        fetchStudyData();
        // 1분마다 자동 새로고침 (부모님이 켜두셔도 자동으로 바뀜)
        setInterval(fetchStudyData, 60000); 
    </script>
</body>
</html>
