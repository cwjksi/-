<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 SNU 대비 학습 대시보드</title>
    
    <link rel="icon" type="image/png" href="snu_ui_download.png">
    <link rel="shortcut icon" type="image/png" href="snu_ui_download.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        .study-card { transition: all 0.25s ease; border: 1px solid #f1f5f9; }
        .study-card:hover { transform: translateY(-7px); box-shadow: 0 25px 50px rgba(0,0,0,0.06); border-color: #153161; }
        .content-text { white-space: pre-wrap; word-break: break-all; }
        .snu-navy { color: #153161; }
        .snu-bg-navy { background-color: #153161; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <div class="max-w-7xl mx-auto px-5 py-16">
        
        <header class="text-center mb-16 bg-white p-10 rounded-[3.5rem] shadow-sm border border-slate-100">
            <div class="inline-block px-5 py-1 snu-bg-navy text-white rounded-full text-[10px] font-black mb-6 tracking-widest uppercase shadow-sm">ROAD TO SNU</div>
            
            <div class="flex items-center justify-center gap-4 md:gap-10 mb-8">
                <img src="snu_ui_download.png" alt="SNU" class="h-16 md:h-24 w-auto object-contain">
                <h1 class="text-3xl md:text-5xl font-black snu-navy leading-tight tracking-tight">실시간 교재별<br>학습 현황</h1>
                <img src="snu_ui_download.png" alt="SNU" class="h-16 md:h-24 w-auto object-contain">
            </div>

            <p class="text-slate-600 text-lg leading-relaxed max-w-3xl mx-auto">
                2027학년도 서울대학교 입학을 목표로 수능 교재를 정리했습니다.<br>
                <span class="font-bold snu-navy underline decoration-blue-100 underline-offset-4 font-black">아들의 학습 현황을 실시간으로 확인하실 수 있습니다.</span>
            </p>
            <div id="last-update" class="text-[10px] text-slate-300 mt-10 font-mono tracking-widest uppercase font-bold"></div>
        </header>

        <div id="study-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 font-medium">
                데이터를 연결하는 중입니다...
            </div>
        </div>

        <footer class="mt-28 text-center text-slate-300 text-[10px] pb-10 tracking-tighter">
            VERITAS LUX MEA • 2026 STUDY DASHBOARD SYSTEM
        </footer>
    </div>

    <script>
        // 🌟 [본인의 구글 시트 CSV 주소로 꼭 다시 바꿔주세요!]
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSZBXfqKDnblDo8nQmvcnxBCBkDJ3OieS-FPAd_6DVDb2ff8kVCGvWIArYeL_D_ya8iSqDp86ccpvp8/pub?output=csv';

        async function fetchStudyData() {
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvData = await response.text();
                
                const rows = [];
                let currentLine = [];
                let currentField = '';
                let inQuotes = false;

                for (let i = 0; i < csvData.length; i++) {
                    const char = csvData[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) {
                        currentLine.push(currentField.trim());
                        currentField = '';
                    } else if (char === '\n' && !inQuotes) {
                        currentLine.push(currentField.trim());
                        rows.push(currentLine);
                        currentLine = [];
                        currentField = '';
                    } else {
                        currentField += char;
                    }
                }
                if (currentField || currentLine.length > 0) {
                    currentLine.push(currentField.trim());
                    rows.push(currentLine);
                }

                const container = document.getElementById('study-container');
                container.innerHTML = '';

                const dataRows = rows.slice(1).filter(r => r[0] && r[0] !== "");

                if (dataRows.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-20 text-slate-300 font-bold">표시할 데이터가 없습니다.</div>';
                    return;
                }

                dataRows.reverse().forEach(cols => {
                    const [bookName, difficulty, content, pages, cheers] = cols;
                    const card = `
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm study-card flex flex-col justify-between h-full">
                            <div>
                                <div class="flex justify-between items-start mb-6">
                                    <span class="px-2.5 py-1 snu-bg-navy text-white text-[9px] font-black rounded-md tracking-wider">
                                        LV: ${difficulty || '-'}
                                    </span>
                                    <span class="text-slate-400 text-[10px] font-bold bg-slate-50 px-2 py-1 rounded font-mono">
                                        ${pages || 0} P
                                    </span>
                                </div>
                                <h2 class="text-xl font-black snu-navy mb-5 leading-tight">${bookName}</h2>
                                <div class="bg-slate-50 p-5 rounded-2xl mb-6">
                                    <p class="text-slate-600 text-sm leading-relaxed content-text font-medium">${content || '기록 없음'}</p>
                                </div>
                            </div>
                            ${cheers ? `
                            <div class="mt-auto p-4 bg-indigo-50/50 rounded-xl border-l-4 border-[#153161]">
                                <p class="text-[9px] snu-navy font-black mb-1 italic opacity-70 uppercase tracking-widest">Message</p>
                                <p class="text-slate-800 text-xs font-bold content-text leading-snug">${cheers}</p>
                            </div>
                            ` : ''}
                        </div>
                    `;
                    container.innerHTML += card;
                });

                document.getElementById('last-update').innerText = `SYNCED: ${new Date().toLocaleString()}`;
            } catch (error) {
                console.error(error);
                document.getElementById('study-container').innerHTML = '<div class="col-span-full text-center py-20 text-red-300 font-bold">연결 확인 중...</div>';
            }
        }

        fetchStudyData();
        setInterval(fetchStudyData, 1800000);
    </script>
</body>
</html>
